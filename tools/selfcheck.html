<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>控糖有数 · 内核自检</title>
<style>
body { font: 14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 24px; background: #f5f6f8; color: #1c1f23; }
.wrap { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 22px 26px; }
h1 { font-size: 19px; margin: 0 0 6px; }
.sum { font-size: 15px; margin: 10px 0 18px; }
.sum b { color: #0e8a58; }
.fail { color: #c0392b; }
li { margin: 3px 0; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.pass-line { color: #0e8a58; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>控糖有数 · 内核自检</h1>
  <div class="sum" id="sum">运行中…</div>
  <div id="box"></div>
</div>
<script src="../assets/data.js"></script>
<script src="../assets/core.js"></script>
<script src="selfcheck.js"></script>
<script>
(function () {
  var r = window.SugarSelfCheck, sum = document.getElementById('sum'), box = document.getElementById('box');
  if (!r) { sum.innerHTML = '<span class="fail">自检脚本未执行</span>'; return; }
  sum.innerHTML = '断言 <b>' + r.pass + ' / ' + r.total + '</b> 通过' +
    (r.fails.length ? '，<span class="fail">' + r.fails.length + ' 项失败</span>' : '，全部通过');
  box.innerHTML = r.fails.length
    ? '<ul class="fail">' + r.fails.map(function (f) { return '<li>FAIL ' + f + '</li>'; }).join('') + '</ul>'
    : '<p class="pass-line">ALL PASS — 换算、配料表解析、数据集、记录、测评、导出、管理口令全部通过。</p>';
}());
</script>
</body>
</html>
